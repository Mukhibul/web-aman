<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Siswa</title>
</head>
<body>
    <div class="container">
        <h2>Formulir Pendaftaran Siswa</h2>
        <form>
            <fieldset> 
                <legend>Data Calon Siswa</legend> 

                <label for="nama">Nama Calon Siswa</label>:
                <input type="text" id="nama" name="nama"><br><br>
                
                <label for="ttl">Tempat/Tanggal Lahir</label>:
                <input type="text" id="ttl" name="ttl">
                <input type="date" id="tanggal" name="tanggal"><br><br>
                
                <label for="agama">Agama</label>:
                <select id="agama" name="agama">
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select><br><br>
                
                <label for="alamat">Alamat</label>:
                <textarea id="alamat" name="alamat" rows="3" cols="30"></textarea><br><br>
                
                <label for="telepon">No Telp/Hp</label>:
                <input type="text" id="telepon" name="telepon"><br><br>
                
                <label>Jenis Kelamin</label>:
                <input type="radio" name="gender" value="Pria"> Pria
                <input type="radio" name="gender" value="Wanita"> Wanita<br><br>
                
                <label>Hobi</label>:
                <input type="checkbox" name="hobi" value="Travelling"> Travelling
                <input type="checkbox" name="hobi" value="Running"> Running
                <input type="checkbox" name="hobi" value="Olahraga"> Olahraga<br><br>
                
                <label for="foto">Pas Foto</label>:
                <input type="file" id="foto" name="foto" accept="image/*"><br><br>
                
                <input type="submit" value="SUBMIT">
            </fieldset>
        </form>
    </div>
</body>
</html>
