<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ee0979, #ff6a00);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      max-width: 1000px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      font-weight: bold;
    }

    header nav a {
      margin: 0 1rem;
      color: #333;
      text-decoration: none;
    }

    header nav a:hover {
      color: #ee0979;
    }

    .login-box {
      display: flex;
      padding: 3rem;
      background: linear-gradient(135deg, #843cf6, #5323d0);
      color: #fff;
      justify-content: space-between;
      position: relative;
    }

    .form-box {
      background: #fff;
      color: #333;
      padding: 2rem;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
    }

    .form-box h2 {
      margin-bottom: 1rem;
      color: #5323d0;
    }

    .form-box input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .form-box button {
      width: 100%;
      padding: 0.75rem;
      background: #5323d0;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .form-box button:hover {
      background: #843cf6;
    }

    .form-box .links {
      margin-top: 1rem;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
    }

    .illustration {
      flex: 1;
      background: url('https://img.freepik.com/free-vector/login-concept-illustration_114360-739.jpg') center/contain no-repeat;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .login-box {
        flex-direction: column;
        align-items: center;
      }

      .illustration {
        display: none;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>BUSINESS COMPANY</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">About Us</a>
      <a href="#">Contact Us</a>
    </nav>
  </header>

  <div class="login-box">
    <div class="form-box">
      <h2>Welcome</h2>
      <p>Please login to your account</p>
      <input type="text" placeholder="Username" />
      <input type="password" placeholder="Password" />
      <button>Login</button>
      <div class="links">
        <a href="#">Forgot Password?</a>
        <a href="#">Create Account</a>
      </div>
    </div>
    <div class="illustration"></div>
  </div>
</div>

</body>
</html>
