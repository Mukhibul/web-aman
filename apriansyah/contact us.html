<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, white, #85a8dd);
            color: white;
            text-align: center;
        }
        .container {
            width: 50%;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border-radius: 10px;
        }
        h2 {
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #2575fc;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #6a11cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Contact Us</h2>
        <p>Jika Anda ingin menghubungi saya, silakan isi form di bawah ini.</p>
        <form action="mailto:emailanda@example.com" method="post" enctype="text/plain">
            <input type="text" name="name" placeholder="Nama Anda" required>
            <input type="email" name="email" placeholder="Email Anda" required>
            <textarea name="message" rows="5" placeholder="Pesan Anda" required></textarea>
            <button type="submit">Kirim</button>
        </form>
        <p>Atau hubungi saya melalui:</p>
        <p>Email: <a href="" style="color: #4facfe;">muhammad.mukhibulaman@gmail.com</a></p>
        <p>WhatsApp: <a href="#" style="color: #4facfe;">+62 822-6836-4848</a></p>
    </div>

</body>
</html>
